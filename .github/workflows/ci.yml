name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: 6.8.3

jobs:
  lint:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p keywright-core --all-targets -- -D warnings
      - run: cargo test -p keywright-core

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest, qt_arch: win64_msvc2022_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1 libfontconfig1
      - name: Build
        run: cargo build --release -p keywright
      - name: Start the app and load every QML page
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
          KEYWRIGHT_SELFTEST: "1"
        run: |
          bin=target/release/keywright
          [ -f "$bin.exe" ] && bin="$bin.exe"
          timeout 60 "$bin" 2>&1 | tee selftest.log
          grep -q keywright-qml-ready selftest.log
